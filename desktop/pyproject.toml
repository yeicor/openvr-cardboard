[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvrcardboard"
version = "1.1.0"
description = "Webcam tracking, gamepad VR controllers and phone HMD streaming for SteamVR"
readme = { text = "Webcam tracking, gamepad controllers and phone HMD streaming for OpenVR. See the repository README for setup.", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "OpenVR Cardboard contributors" }]
keywords = ["steamvr", "openvr", "vr", "tracking", "webcam", "aruco", "mediapipe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "numpy>=2.0",
    "Pillow>=11.0",
    "websockets>=15.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.10"]
tracking = [
    # ArUcoDetector and solvePnPRefineLM need OpenCV 4.7; the app is developed
    # and tested against OpenCV 5, whose ArUco detector is noticeably faster.
    "opencv-contrib-python>=5.0",
    # The Tasks API ships its models as .task files and no longer depends on
    # the removed mediapipe.solutions namespace.
    "mediapipe>=1.2.3",
]
gamepad = ["pygame-ce>=2.5.8"]
screen = ["mss>=10.0"]
video = ["imageio-ffmpeg>=0.6"]
all = [
    "PySide6>=6.10",
    "opencv-contrib-python>=5.0",
    "mediapipe>=1.2.3",
    "pygame-ce>=2.5.8",
    "mss>=10.0",
    "imageio-ffmpeg>=0.6",
]

[project.scripts]
openvrcardboard = "openvrcardboard.app:main"
openvrcardboard-install = "openvrcardboard.installer:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openvrcardboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: container end-to-end tests that use real sockets"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with correctness and import hygiene; style rules can be enabled
# incrementally without churning the whole codebase at once.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# These modules are fully annotated today. Add files here as they reach the
# same bar; a failing type check then blocks CI instead of accumulating noise.
files = [
    "openvrcardboard/config.py",
    "openvrcardboard/config_validation.py",
    "openvrcardboard/installer.py",
    "openvrcardboard/mediapipe_models.py",
    "openvrcardboard/netutil.py",
    "openvrcardboard/phone_camera.py",
    "openvrcardboard/protocol.py",
]
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["openvrcardboard"]
omit = ["openvrcardboard/__main__.py"]

[tool.coverage.report]
# Modest floor: the container and emulator jobs exercise the optional
# backends that a bare local run skips, and coverage should ratchet up from
# here rather than fail on day one.
fail_under = 65
skip_covered = true
